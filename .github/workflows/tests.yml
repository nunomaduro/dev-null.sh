name: tests

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Cache Rector
        uses: actions/cache@v6
        with:
          path: tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock', 'rector.php') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rector-${{ hashFiles('composer.lock', 'rector.php') }}-
            ${{ runner.os }}-rector-

      - name: Lint
        run: composer test:lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Cache PHPStan
        uses: actions/cache@v6
        with:
          path: tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock', 'phpstan.neon') }}-
            ${{ runner.os }}-phpstan-

      - name: Types
        run: composer test:types

  type-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type Coverage
        run: composer test:type-coverage

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable PostgreSQL Search Extensions
        run: |
          # Parallel test databases inherit extensions from template1.
          for database in testing template1; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -U root -d "$database" -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          done

      - name: Setup
        uses: ./.github/actions/setup
        with:
          coverage: pcov

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Cache Built Assets
        id: build-cache
        uses: actions/cache@v6
        with:
          path: public/build
          key: ${{ runner.os }}-build-${{ hashFiles('bun.lock', 'package.json', 'vite.config.ts', 'tsconfig.json', 'resources/**', 'routes/**', 'app/**') }}

      - name: Build Assets
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: bun run build

      - name: Tests
        run: composer test:unit

      - name: Impression Concurrency Tests
        run: composer test:concurrency
